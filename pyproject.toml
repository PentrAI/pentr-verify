[project]
name = "pentr-verify"
version = "0.1.0"
description = "Offline verifier for Pentr evidence lockers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "PentrAI" }]
dependencies = [
    "cryptography>=42",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/PentrAI/pentr-verify"

[project.scripts]
pentr-verify = "pentr_verify.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pentr_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pentr_verify"]
